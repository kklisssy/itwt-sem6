services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/project-shop
      JWT_SECRET: project-shop-dev-secret
      JWT_EXPIRES_IN: 7d
    expose:
      - "3001"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      target: frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
